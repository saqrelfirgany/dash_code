plugins {
    // Core Android application plugin
    id "com.android.application"
    // Kotlin support plugin
    id "kotlin-android"
    // Flutter Gradle plugin (must be applied after Android/Kotlin plugins)
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase Google Services plugin (ensure proper configuration from the project-level buildscript)
    id "com.google.gms.google-services"
    // Firebase Crashlytics plugin for capturing crash reports
    id "com.google.firebase.crashlytics"
}

// Instead of applying Firebase Performance Monitoring via the plugins DSL,
// apply it using the legacy syntax.
apply plugin: 'com.google.firebase.firebase-perf'

android {
    // Define your application namespace
    namespace = "com.saqrelfirgany.dash_code"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        // Ensures Kotlin uses Java 8 bytecode compatibility
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Application identifier and Flutter-defined versions for min/target SDK and versioning
        applicationId = "com.saqrelfirgany.dash_code"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Enable Crashlytics mapping file uploads for deobfuscation
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
            // NOTE: Replace 'signingConfigs.debug' with your proper release signing configuration
            signingConfig = signingConfigs.debug
        }
        debug {
            // Optionally enable Crashlytics in debug builds (useful for testing)
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
    }
}

flutter {
    // Point to the root Flutter project directory
    source = "../.."
}
