plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.firebase-perf'
}

// Instead of applying Firebase Performance Monitoring via the plugins DSL,
// apply it using the legacy syntax.
apply plugin: 'com.google.firebase.firebase-perf'

android {
    // Define your application namespace
    namespace = "com.saqrelfirgany.dash_code"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        // Ensures Kotlin uses Java 8 bytecode compatibility
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Application identifier and Flutter-defined versions for min/target SDK and versioning
        applicationId = "com.saqrelfirgany.dash_code"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

    }
}

flutter {
    // Point to the root Flutter project directory
    source = "../.."
}

// Dependencies required by the project
dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    debugImplementation 'com.google.firebase:firebase-crashlytics-ndk:18.6.0'
}